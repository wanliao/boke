name: Build check

# 仅做构建校验：确认 main 分支能正常编译，不再向 dist 分支发布产物。
# 实际部署走服务器上的 update.sh（git pull + npm run docs:build），
# 或在本地 build 后手动上传 .vitepress/dist。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress site
        run: npm run docs:build
